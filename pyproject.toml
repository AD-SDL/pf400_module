[project]
name = "pf400_module"
version = "2.1.0"
description = "Software for automatting a PF400 robot"
authors = [
    {name = "Ryan D. Lewis", email="ryan.lewis@anl.gov"},
    {name = "Doga Ozgulbas", email="dozgulbas@anl.gov"},
    {name = "Abe Stroka", email="astroka@anl.gov"},
    {name = "Tobias Ginsburg", email = "tginsburg@anl.gov"},
]
dependencies = [
    "madsci-node-module~=0.7",
    "pynput>=1.8.1",
    "madsci-client~=0.7",
    "madsci-common~=0.7",
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/pf400_module"


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.12.0",
    "pre-commit>=4.3.0",
    "pydantic-settings-export>=1.0.2",
]

[tool.pydantic_settings_export]
project_dir = "."
default_settings = [
    "pf400_rest_node:PF400NodeConfig",
]

[[tool.pydantic_settings_export.generators.markdown]]
paths = ["docs/Configuration.md"]

[[tool.pydantic_settings_export.generators.dotenv]]
paths = [".env.example"]
